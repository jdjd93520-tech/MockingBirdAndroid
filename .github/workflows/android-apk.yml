name: Build MockingBird APK

on:
  push:
    branches: [main]
    paths:
      - 'MockingBird/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-31" "build-tools;31.0.0"

      - name: Build debug APK
        working-directory: MockingBird
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MockingBird-debug-apk
          path: MockingBird/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
